name: Build NoobFree Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NoobFree source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Installable Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename Artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk NoobFree-debug.apk

      - name: Downloadable NoobFree Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NoobFree-debug.apk
          path: NoobFree-debug.apk
